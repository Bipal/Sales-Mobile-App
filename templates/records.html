<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sales Records</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f7fb;
        }

        .app-header {
            background: #0d6efd;
            color: white;
        }

        .record-card {
            border: none;
            border-radius: 16px;
        }

        .record-value {
            font-weight: 600;
        }

        .location {
            color: #198754;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="app-header shadow-sm">

        <div class="container py-3">

            <h1 class="h4 mb-1">
                Sales Records
            </h1>

            <div class="small opacity-75">
                Records stored in PostgreSQL
            </div>

        </div>

    </header>


    <!-- CONTENT -->

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>

                <h2 class="h5 mb-1">
                    Saved Sales
                </h2>

                <div
                    id="recordCount"
                    class="text-muted small"
                >
                    Loading records...
                </div>

            </div>

            <button
                class="btn btn-outline-primary btn-sm"
                onclick="loadRecords()"
            >
                ↻ Refresh
            </button>

        </div>


        <!-- LOADING -->

        <div
            id="loading"
            class="text-center py-5"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>

            <div class="mt-2">
                Loading records...
            </div>

        </div>


        <!-- RECORDS -->

        <div
            id="recordsContainer"
            class="d-grid gap-3"
        ></div>


        <!-- EMPTY -->

        <div
            id="emptyMessage"
            class="alert alert-info d-none"
        >
            No sales records found.
        </div>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="alert alert-danger d-none"
        ></div>


        <!-- NAVIGATION -->

        <div class="d-grid gap-2 mt-4">

            <a
                href="/"
                class="btn btn-primary"
            >
                ← Back to Sales Entry
            </a>

            <a
                href="/dashboard"
                class="btn btn-success"
            >
                📊 View Dashboard
            </a>

        </div>

    </main>


    <script>

        // ====================================================
        // LOAD RECORDS
        // ====================================================

        async function loadRecords() {

            const container =
                document.getElementById(
                    "recordsContainer"
                );

            const loading =
                document.getElementById(
                    "loading"
                );

            const emptyMessage =
                document.getElementById(
                    "emptyMessage"
                );

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            const recordCount =
                document.getElementById(
                    "recordCount"
                );


            container.innerHTML = "";

            emptyMessage.classList.add(
                "d-none"
            );

            errorMessage.classList.add(
                "d-none"
            );

            loading.classList.remove(
                "d-none"
            );


            try {

                const response =
                    await fetch(
                        "/entries"
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to retrieve records."
                    );

                }


                loading.classList.add(
                    "d-none"
                );


                recordCount.textContent =
                    `${data.count} record(s)`;


                if (
                    !data.entries ||
                    data.entries.length === 0
                ) {

                    emptyMessage.classList.remove(
                        "d-none"
                    );

                    return;

                }


                data.entries.forEach(
                    (record) => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "card shadow-sm record-card";


                        card.innerHTML = `

                            <div class="card-body">

                                <div class="d-flex justify-content-between align-items-start mb-3">

                                    <div>

                                        <h5 class="mb-1">
                                            ${escapeHtml(record.customer_name)}
                                        </h5>

                                        <div class="text-muted">
                                            ${escapeHtml(record.product)}
                                        </div>

                                    </div>

                                    <span class="badge bg-primary">
                                        #${record.id}
                                    </span>

                                </div>


                                <div class="row g-2 small">

                                    <div class="col-6">

                                        <div class="text-muted">
                                            Country
                                        </div>

                                        <div class="record-value">
                                            ${escapeHtml(record.country)}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Region
                                        </div>

                                        <div class="record-value">
                                            ${escapeHtml(record.region)}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Category
                                        </div>

                                        <div class="record-value">
                                            ${escapeHtml(record.category)}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Quantity
                                        </div>

                                        <div class="record-value">
                                            ${record.quantity}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Sales
                                        </div>

                                        <div class="record-value">
                                            ${formatNumber(record.sales)}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Profit
                                        </div>

                                        <div class="record-value">
                                            ${formatNumber(record.profit)}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Discount
                                        </div>

                                        <div class="record-value">
                                            ${formatNumber(record.discount)}
                                        </div>

                                    </div>


                                    <div class="col-6">

                                        <div class="text-muted">
                                            Shipping Cost
                                        </div>

                                        <div class="record-value">
                                            ${formatNumber(record.shipping_cost)}
                                        </div>

                                    </div>

                                </div>


                                <hr>


                                <div class="location small">

                                    📍
                                    ${escapeHtml(record.location_name)}

                                    <br>

                                    <span class="text-muted">

                                        Latitude:
                                        ${Number(record.latitude).toFixed(6)}

                                        |

                                        Longitude:
                                        ${Number(record.longitude).toFixed(6)}

                                    </span>

                                </div>


                                <div class="text-muted small mt-2">

                                    Created:
                                    ${formatDate(record.created_at)}

                                </div>

                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    error
                );

                loading.classList.add(
                    "d-none"
                );

                errorMessage.textContent =
                    error.message;

                errorMessage.classList.remove(
                    "d-none"
                );

            }

        }


        // ====================================================
        // NUMBER FORMAT
        // ====================================================

        function formatNumber(value) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-IN",
                {
                    maximumFractionDigits: 2
                }
            );

        }


        // ====================================================
        // DATE FORMAT
        // ====================================================

        function formatDate(value) {

            if (!value) {
                return "-";
            }

            return new Date(
                value
            ).toLocaleString(
                "en-IN"
            );

        }


        // ====================================================
        // HTML ESCAPE
        // ====================================================

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        // ====================================================
        // INITIAL LOAD
        // ====================================================

        window.addEventListener(
            "load",
            loadRecords
        );

    </script>

</body>

</html>
