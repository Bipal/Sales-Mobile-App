<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Mobile POC</title>

    <meta name="theme-color" content="#0d6efd">
    <meta name="description" content="Mobile Sales Data Collection POC">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/icon-192.png">

    <style>
        body {
            background: #f5f7fb;
        }

        .app-header {
            background: #0d6efd;
            color: white;
        }

        .location-card {
            background: #eef6ff;
            border: 1px solid #cfe2ff;
        }

        .location-text {
            font-size: 0.9rem;
        }

        .form-label {
            font-weight: 600;
        }

        .submit-button {
            min-height: 52px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .card {
            border: none;
            border-radius: 16px;
        }

        .form-control {
            min-height: 46px;
            border-radius: 10px;
        }

        .small-note {
            font-size: 0.78rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

<header class="app-header shadow-sm">
    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center gap-3">
            <div>
                <h1 class="h4 mb-1">Sales Mobile POC</h1>
                <div class="small opacity-75">
                    Mobile Sales Data Collection
                </div>
            </div>

            <div class="text-end">
                <div class="small">Device Location</div>
                <div id="locationStatus" class="fw-semibold">
                    Detecting...
                </div>
            </div>
        </div>
    </div>
</header>

<main class="container py-4">

    <div class="card shadow-sm mb-3 location-card">
        <div class="card-body">
            <div class="d-flex align-items-start gap-2">
                <div class="fs-5">📍</div>

                <div class="flex-grow-1">
                    <div class="fw-bold">Current Location</div>

                    <div id="locationName" class="location-text mt-1">
                        Detecting your location...
                    </div>

                    <div id="coordinates" class="small-note mt-1">
                        Latitude/Longitude: waiting for permission
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h2 class="h5 mb-4">Enter Sales Information</h2>

            <form id="salesForm" novalidate>

                <div class="row g-3">

                    <div class="col-12">
                        <label for="customer_name" class="form-label">
                            Customer Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="customer_name"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="country" class="form-label">
                            Country
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="country"
                            placeholder="e.g. India"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="region" class="form-label">
                            Region
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="region"
                            placeholder="e.g. South Asia"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="product" class="form-label">
                            Product
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="product"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="category" class="form-label">
                            Category
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="category"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="quantity" class="form-label">
                            Quantity
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="quantity"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="sales" class="form-label">
                            Sales
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="sales"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="profit" class="form-label">
                            Profit
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="profit"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="discount" class="form-label">
                            Discount
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="discount"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="shipping_cost" class="form-label">
                            Shipping Cost
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="shipping_cost"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                </div>

                <hr class="my-4">

                <div class="small-note mb-3">
                    Location is captured automatically from the device.
                    It cannot be manually edited.
                </div>

                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn-primary w-100 submit-button"
                >
                    Submit Sales Data
                </button>

            </form>

        </div>
    </div>

</main>

<script src="/static/script.js"></script>

</body>
</html>
