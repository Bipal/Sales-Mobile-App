<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <meta name="theme-color"
          content="#0d6efd">

    <title>
        Sales Management POC
    </title>


    <!-- PWA -->

    <link
        rel="manifest"
        href="/static/manifest.json">


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {

            background:
                #f5f6f8;

        }


        .header {

            background:
                #0d6efd;

            color:
                white;

            padding:
                18px;

            border-radius:
                0 0 20px 20px;

        }


        .card {

            border:
                none;

            border-radius:
                16px;

        }


        .location {

            font-size:
                12px;

            text-align:
                right;

        }


        .record {

            border-bottom:
                1px solid #ddd;

            padding:
                12px 0;

        }


        .live-dot {

            width:
                9px;

            height:
                9px;

            background:
                #198754;

            border-radius:
                50%;

            display:
                inline-block;

        }

    </style>

</head>


<body>


<header class="header">

    <div
        class="container">

        <div
            class="d-flex
                   justify-content-between
                   align-items-center">

            <div>

                <h3>
                    Sales POC
                </h3>

                <small>
                    Mobile Sales Entry
                </small>

            </div>


            <div
                id="locationDisplay"
                class="location">

                📍 Detecting...

            </div>

        </div>

    </div>

</header>


<main
    class="container mt-3">


    <div
        id="locationMessage">
    </div>


    <!-- SALES FORM -->

    <div
        class="card shadow-sm">

        <div
            class="card-body">


            <h5>
                Sales Entry
            </h5>


            <form
                id="salesForm">


                <div
                    class="row g-3">


                    <div
                        class="col-12">

                        <label>
                            Customer Name
                        </label>

                        <input
                            id="customer_name"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Country
                        </label>

                        <input
                            id="country"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Region
                        </label>

                        <input
                            id="region"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Product
                        </label>

                        <input
                            id="product"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Category
                        </label>

                        <input
                            id="category"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Quantity
                        </label>

                        <input
                            id="quantity"
                            type="number"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Sales
                        </label>

                        <input
                            id="sales"
                            type="number"
                            step="0.01"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Profit
                        </label>

                        <input
                            id="profit"
                            type="number"
                            step="0.01"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-6">

                        <label>
                            Discount
                        </label>

                        <input
                            id="discount"
                            type="number"
                            step="0.01"
                            class="form-control"
                            required>

                    </div>


                    <div
                        class="col-12">

                        <label>
                            Shipping Cost
                        </label>

                        <input
                            id="shipping_cost"
                            type="number"
                            step="0.01"
                            class="form-control"
                            required>

                    </div>


                </div>


                <button
                    class="btn btn-primary
                           w-100 mt-4">

                    Submit Sales

                </button>


            </form>


            <div
                id="message"
                class="mt-3">
            </div>


        </div>

    </div>


    <!-- LIVE RECORDS -->

    <div
        class="card shadow-sm mt-4">

        <div
            class="card-body">


            <div
                class="d-flex
                       justify-content-between">

                <h5>
                    Recent Sales
                </h5>

                <span
                    class="text-success">

                    <span
                        class="live-dot">
                    </span>

                    Live

                </span>

            </div>


            <hr>


            <div
                id="records">

                Loading...

            </div>


        </div>

    </div>


</main>


<script
    src="/static/script.js">
</script>


</body>

</html>
