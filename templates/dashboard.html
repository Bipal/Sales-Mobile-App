<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sales Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f7fb;
        }

        .app-header {
            background: #198754;
            color: white;
        }

        .dashboard-card {
            border: none;
            border-radius: 16px;
        }

        .powerbi-frame {
            width: 100%;
            height: 75vh;
            min-height: 600px;
            border: none;
            border-radius: 12px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="app-header shadow-sm">

        <div class="container py-3">

            <h1 class="h4 mb-1">
                📊 Sales Dashboard
            </h1>

            <div class="small opacity-75">
                Power BI Analytics
            </div>

        </div>

    </header>


    <!-- CONTENT -->

    <main class="container-fluid py-3">

        <div class="card shadow-sm dashboard-card">

            <div class="card-body p-2">

                {% if powerbi_url %}

                    <iframe
                        class="powerbi-frame"
                        src="{{ powerbi_url }}"
                        frameborder="0"
                        allowfullscreen="true">
                    </iframe>

                {% else %}

                    <div class="alert alert-warning m-3">

                        <h5>
                            Power BI dashboard is not configured yet.
                        </h5>

                        <p class="mb-0">

                            Add the Power BI embed URL to the
                            <strong>
                                POWERBI_EMBED_URL
                            </strong>
                            environment variable in Render.

                        </p>

                    </div>

                {% endif %}

            </div>

        </div>


        <!-- NAVIGATION -->

        <div class="d-grid gap-2 mt-3">

            <a
                href="/"
                class="btn btn-primary"
            >
                ← Back to Sales Entry
            </a>

            <a
                href="/records"
                class="btn btn-outline-primary"
            >
                📋 View Records
            </a>

        </div>

    </main>

</body>

</html>
